<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <rect width="100" height="100" rx="22" fill="#326CE5"/>
  <!-- Kubernetes Helm Wheel -->
  <g transform="translate(50, 50) scale(0.78)" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="0" cy="0" r="14" fill="#326CE5" stroke-width="6"/>
    <!-- 7 spokes of the helm wheel -->
    <line x1="0" y1="-14" x2="0" y2="-42"/>
    <line x1="33" y1="-9" x2="39" y2="-15"/>
    <line x1="12.3" y1="-6.7" x2="38.7" y2="-21.2"/>
    <line x1="13.7" y1="2.7" x2="41.3" y2="8.2"/>
    <line x1="6.1" y1="12.6" x2="19.1" y2="39.6"/>
    <line x1="-6.1" y1="12.6" x2="-19.1" y2="39.6"/>
    <line x1="-13.7" y1="2.7" x2="-41.3" y2="8.2"/>
    <line x1="-12.3" y1="-6.7" x2="-38.7" y2="-21.2"/>
    <!-- Wheel rim heptagon -->
    <circle cx="0" cy="0" r="28" fill="none" stroke-width="4.5"/>
  </g>
</svg>
